    <!-- EaglercraftX 1.20.6 WASM-GC launch configuration -->

    <script type="text/javascript">
        "use strict";

        window.addEventListener("load", function() {

            if (window.location.href.indexOf("file:") === 0) {
                alert(
                    "HTTP please, do not open this file locally. " +
                    "Run a local HTTP server and load it via HTTP."
                );
                return;
            }

            var relayId = Math.floor(Math.random() * 3);

            window.eaglercraftXOpts = {
                demoMode: false,

                container: "game_frame",

                assetsURI:
                    "https://raw.githubusercontent.com/eymenwsmc/offline/main/120.epw?v=5430efd6",

                worldsDB: "worlds",

                servers: [
                    /* Example:
                    {
                        addr: "ws://localhost:8081/",
                        name: "Local test server"
                    }
                    */
                ],

                relays: [
                    {
                        addr: "wss://relay.deev.is/",
                        comment: "lax1dude relay #1",
                        primary: relayId === 0
                    },
                    {
                        addr: "wss://relay.lax1dude.net/",
                        comment: "lax1dude relay #2",
                        primary: relayId === 1
                    },
                    {
                        addr: "wss://relay.shhnowisnottheti.me/",
                        comment: "ayunami relay #1",
                        primary: relayId === 2
                    }
                ]
            };

            // Support ?server=YOUR_SERVER_URL

            var query = window.location.search;

            if (
                typeof query === "string" &&
                query.length > 0 &&
                typeof window.URLSearchParams !== "undefined"
            ) {
                var params = new URLSearchParams(query);
                var server = params.get("server");

                if (server) {
                    window.eaglercraftXOpts.joinServer = server;
                }
            }

            var launchCounter = 0;
            var launchSkipCountdown = false;
            var gameStarted = false;

            var countdown = document.getElementById("countdown");
            var progress = document.getElementById("progress_bar");
            var launchScreen = document.getElementById("launch_screen");
            var skipButton = document.getElementById("skip");
            var errorMessage = document.getElementById("error_message");

            var timer = null;

            function startGame() {
                if (gameStarted) {
                    return;
                }

                gameStarted = true;

                if (timer !== null) {
                    clearInterval(timer);
                }

                skipButton.disabled = true;
                countdown.textContent = "0";
                progress.style.width = "100%";

                try {
                    // Launch Eaglercraft
                    main();

                    // Keep the loading screen visible until the
                    // countdown has completed.
                    launchScreen.remove();

                } catch (error) {
                    console.error(
                        "Failed to launch Eaglercraft:",
                        error
                    );

                    gameStarted = false;
                    skipButton.disabled = false;

                    errorMessage.style.display = "block";
                    errorMessage.textContent =
                        "Unable to start the game. Check the browser console.";

                    countdown.textContent = "!";
                }
            }

            // Five-second countdown with progress bar

            timer = setInterval(function() {

                launchCounter++;

                var percentage = Math.min(
                    launchCounter,
                    100
                );

                progress.style.width = percentage + "%";

                countdown.textContent = Math.ceil(
                    (100 - percentage) / 20
                );

                if (
                    launchCounter >= 100 ||
                    launchSkipCountdown
                ) {
                    startGame();
                }

            }, 50);

            // Skip countdown button

            skipButton.onclick = function() {
                launchSkipCountdown = true;
                startGame();
            };

        });
    </script>
